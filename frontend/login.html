<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EV Fleet Intelligence - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">
                <h1>EV Fleet Intelligence</h1>
                <p>Fleet Management System</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Show password"
            >
                Show
            </button>

        </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

                <p
                    id="loginError"
                    class="login-error"
                ></p>

            </form>

        </div>

    </div>

    <script src="script.js"></script>


</body>

</html>
